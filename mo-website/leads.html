<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mo Entertainments Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&family=Mr+Dafoe&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=10">
<style>
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:120px 0 22px}
.bar h1{font-size:clamp(34px,5vw,56px);line-height:1}
.livepill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);padding:6px 12px;font-size:12px;margin-left:auto}
.livepill .dot{background:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid var(--line);margin-bottom:18px}
.kpis div{padding:16px 18px;border-right:1.5px solid var(--line)}
.kpis div:last-child{border:0}
.kpis b{display:block;font:400 52px/1 var(--serif)}
.kpis small{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.list{display:grid;gap:10px;padding-bottom:60px}
.lead{border:1px solid var(--line);border-radius:16px;background:var(--panel);display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:16px;padding:16px 18px;align-items:center}
.lead.fresh{animation:flash 2.4s ease-out}
@keyframes flash{0%{border-color:var(--glow);box-shadow:0 0 0 6px #7B61FF55;transform:translateY(-8px)}100%{box-shadow:none}}
.lead h3{font-size:30px;line-height:1.05}
.lead .sm{font-size:12px;color:var(--muted)}
.lead .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lead .v{font-weight:600;font-size:13px}
.st{font-size:11px;font-weight:600;padding:3px 8px;border:1.5px solid currentColor;text-transform:uppercase;letter-spacing:.06em}
.st.new{color:var(--hot)}.st.contacted{color:var(--glow)}.st.won{color:var(--ok)}.st.lost{color:var(--muted)}
.lead-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.lead-acts a,.lead-acts select{border:1.5px solid var(--line);background:var(--night);padding:8px 10px;font-size:12px;min-height:38px;text-decoration:none;display:inline-flex;align-items:center}
.toast{position:fixed;right:16px;bottom:16px;z-index:99;background:var(--moon);color:var(--night);padding:14px 18px;max-width:340px;font-weight:600;box-shadow:0 20px 50px #0008;transform:translateY(140%);transition:transform .35s}
.toast.show{transform:none}
.tip{border:1.5px dashed var(--line);padding:14px 16px;font-size:13px;color:var(--muted);margin-bottom:18px}
@media(max-width:860px){.lead{grid-template-columns:1fr 1fr}.lead-acts{grid-column:1/-1;justify-content:flex-start}.kpis{grid-template-columns:1fr 1fr}.kpis div:nth-child(2){border-right:0}.kpis div:nth-child(-n+2){border-bottom:1.5px solid var(--line)}}
</style>
</head>
<body>
<header class="top always">
  <div class="wrap">
    <a class="brand" href="index.html"><span data-logo="compact"></span></a>
    <div style="display:flex;gap:8px"><button class="btn" id="notify" style="min-height:40px;padding:8px 12px">🔔 Alerts</button><a class="btn primary" href="enquire.html" target="_blank" style="min-height:40px;padding:8px 12px">Booking form ↗</a></div>
  </div>
</header>
<main class="wrap">
  <div class="bar"><div><span class="kicker">Team inbox</span><h1>Leads</h1></div><span class="livepill"><i class="dot"></i> Live</span></div>
  <p class="tip">New booking requests appear here the moment they are sent. Turn on alerts to get a browser notification.</p>
  <div class="kpis" id="kpis"></div>
  <div class="list" id="list"></div>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="config.js?v=2"></script>
<script src="site.js?v=4"></script>
<script>

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ago = t => { const m = Math.round((Date.now() - new Date(t)) / 6e4); return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago"; };
const fmt = d => d ? new Date(d + "T00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short" }) : "—";

function render(freshId) {
  const leads = LeadStore.all();
  const n = s => leads.filter(l => l.status === s).length;
  document.getElementById("kpis").innerHTML = `<div><b>${n("new")}</b><small>New</small></div><div><b>${n("contacted")}</b><small>Contacted</small></div><div><b>${n("won")}</b><small>Won</small></div><div><b>${leads.length}</b><small>All time</small></div>`;
  document.getElementById("list").innerHTML = leads.map(l => {
    const wa = (l.phone || "").replace(/\D/g, "");
    return `<article class="lead ${l.id === freshId ? "fresh" : ""}">
      <div><span class="st ${l.status}">${l.status}</span> <span class="sm">${esc(l.id)} · ${ago(l.at)}</span><h3 style="margin-top:8px">${esc(l.org || l.name)}</h3><div class="sm">${esc(l.name)}${l.role ? " · " + esc(l.role) : ""}</div></div>
      <div><div class="k">Event</div><div class="v">${esc(l.type)} · ${fmt(l.date)}${l.flexible ? " (flex)" : ""}</div><div class="k" style="margin-top:6px">Where</div><div class="v">${esc(l.city)} · ${esc(l.venue)}</div></div>
      <div><div class="k">Crowd · budget</div><div class="v">${esc(l.crowd)} · ${esc(l.budget)}</div><div class="k" style="margin-top:6px">Needs</div><div class="v">${esc((l.needs || []).join(", ") || "—")}</div>${(l.artists || []).length ? `<div class="k" style="margin-top:6px">Artists</div><div class="v">${esc(l.artists.join(", "))}</div>` : ""}</div>
      <div class="lead-acts"><a href="tel:${esc(l.phone)}">Call</a><a href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a>
        <select data-id="${esc(l.id)}" aria-label="Status">${["new", "contacted", "won", "lost"].map(s => `<option ${s === l.status ? "selected" : ""}>${s}</option>`).join("")}</select></div>
    </article>`;
  }).join("");
}
document.getElementById("list").addEventListener("change", e => { if (e.target.dataset.id) { LeadStore.update(e.target.dataset.id, { status: e.target.value }); render(); } });

function alertLead(lead) {
  render(lead.id);
  const t = document.getElementById("toast");
  t.textContent = `New lead: ${lead.type} · ${lead.org || lead.name} · ${lead.city || ""}`;
  t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 5000);
  document.title = "● New lead · Mo Entertainments";
  if ("Notification" in window && Notification.permission === "granted") new Notification("New Mo Entertainments lead", { body: `${lead.type} · ${lead.org || lead.name} · ${lead.budget || ""}` });
}
LeadStore.channel && LeadStore.channel.addEventListener("message", e => e.data.type === "lead" ? alertLead(e.data.lead) : render());
// Fallback for browsers without BroadcastChannel
addEventListener("storage", e => { if (e.key === LeadStore.key && !LeadStore.channel) render(); });
addEventListener("focus", () => document.title = "Mo Entertainments Leads");
document.getElementById("notify").onclick = () => "Notification" in window && Notification.requestPermission();
setInterval(render, 60000);
render();
</script>
</body>
</html>
